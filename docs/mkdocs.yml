    - Pipelines: api/pipelines.md
    - Task Pipelines (all 51): api/task_pipelines.md
    - Dataset Registry: api/datasets.md
    - CLI Reference: api/cli.md
    - Foundation Models: api/foundation.md
    - Agent: api/agent.md
    - Visualization: api/viz.md
    - Core: api/core.md
    - Benchmarking: api/benchmark.md
