<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 948 164" role="img" aria-label="Which AI-ready gate to use: a raw scene folder goes to prepare_for_ai; clipped optical data to prepare_optical_for_ai; clipped radar to prepare_sar_for_ai"><title>Which AI-ready gate to use: a raw scene folder goes to prepare_for_ai; clipped optical data to prepare_optical_for_ai; clipped radar to prepare_sar_for_ai</title>
  <style>
    :root{--card:#ffffff;--line:#d7dbe0;--title:#1c1e21;--sub:#5a5c63;--pill:#eef3f8;--pillt:#1b4f72;--flow:#1b6a9c;--soft:#f6f8fa;--shadow:rgba(16,24,40,.10)}
    @media (prefers-color-scheme:dark){:root{--card:#242526;--line:#3a3b3d;--title:#e8e8e8;--sub:#b0b3b8;--pill:#2f3a44;--pillt:#a9d6ee;--flow:#6cc4dd;--soft:#1d1e1f;--shadow:rgba(0,0,0,.45)}}
    text{font-family:Ubuntu,"Segoe UI",system-ui,sans-serif}
    .card{fill:var(--card);stroke:var(--line);stroke-width:1.2;filter:drop-shadow(0 2px 3px var(--shadow))}
    .side{fill:var(--soft);stroke:var(--flow);stroke-width:1.3;stroke-dasharray:5 4}
    .t{font-weight:600;font-size:14px;fill:var(--title)}
    .s{font-size:11.5px;fill:var(--sub)}
    .n{font-weight:700;font-size:12px;fill:#fff}
    .pill{fill:var(--pill)}
    .cmd{font-family:"Ubuntu Mono",ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:var(--pillt)}
    .arrow{stroke:var(--flow);stroke-width:2;fill:none;stroke-dasharray:6 6;animation:dash 1.1s linear infinite}
    .head{fill:var(--flow)}
    .step{animation:rise .6s ease-out both}
    .q{fill:var(--card);stroke:var(--line);stroke-width:1.2;filter:drop-shadow(0 2px 3px var(--shadow))}
    .leaf{fill:var(--pill);stroke:var(--flow);stroke-width:1.2}
    .qa{fill:#1b6a9c}
    .mono{font-family:"Ubuntu Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;fill:var(--pillt);font-weight:600}
    .lab{font-size:10.5px;font-weight:700;fill:var(--flow)}
    .labbg{fill:var(--card);stroke:var(--flow);stroke-width:1}
    .band{fill:var(--card);stroke:var(--line);stroke-width:1.2;filter:drop-shadow(0 2px 3px var(--shadow))}
    .bt{font-weight:700;font-size:15px;fill:#fff}
    .bs{font-size:11.5px;fill:rgba(255,255,255,.86)}
    .quote{font-size:12px;font-style:italic;fill:var(--sub)}
    .a0{fill:#1b6a9c}.a1{fill:#2386b0}.a2{fill:#1f9bb0}.a3{fill:#23a58e}.a4{fill:#3aa66b}.a5{fill:#6aa84f}
    @keyframes dash{to{stroke-dashoffset:-12}}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.arrow{animation:none}.step{animation:none}}
  </style>
<path class="arrow" d="M199.0 69.0 H217.0 V30.0 H283.0"/><path class="head" d="M282.0 25.0 L290.0 30.0 L282.0 35.0 Z"/>
<rect class="labbg" x="232.0" y="21.0" width="35.0" height="18" rx="9"/><text class="lab" x="249.5" y="34.0" text-anchor="middle">yes</text>
<path class="arrow" d="M199.0 69.0 H217.0 V108.0 H283.0"/><path class="head" d="M282.0 103.0 L290.0 108.0 L282.0 113.0 Z"/>
<rect class="labbg" x="235.5" y="99.0" width="28.0" height="18" rx="9"/><text class="lab" x="249.5" y="112.0" text-anchor="middle">no</text>
<path class="arrow" d="M506.0 108.0 H524.0 V82.0 H689.0"/><path class="head" d="M688.0 77.0 L696.0 82.0 L688.0 87.0 Z"/>
<rect class="labbg" x="574.5" y="73.0" width="63.0" height="18" rx="9"/><text class="lab" x="606.0" y="86.0" text-anchor="middle">optical</text>
<path class="arrow" d="M506.0 108.0 H524.0 V134.0 H689.0"/><path class="head" d="M688.0 129.0 L696.0 134.0 L688.0 139.0 Z"/>
<rect class="labbg" x="550.0" y="125.0" width="112.0" height="18" rx="9"/><text class="lab" x="606.0" y="138.0" text-anchor="middle">radar (VV, VH)</text>
<g class="step" style="animation-delay:0.00s">
<rect class="q" x="18.0" y="41.0" width="181.0" height="56.0" rx="10"/>
<rect class="qa" x="18.0" y="49.0" width="4" height="40.0" rx="2"/>
<text class="t" x="110.5" y="66.0" text-anchor="middle" style="font-size:13px">A scene folder, or an</text>
<text class="t" x="110.5" y="81.0" text-anchor="middle" style="font-size:13px">un-clipped raster?</text>
</g>
<g class="step" style="animation-delay:0.05s">
<rect class="leaf" x="290.0" y="12.0" width="216.0" height="36.0" rx="10"/>
<text class="mono" x="398.0" y="34.5" text-anchor="middle">client.prepare_for_ai(...)</text>
</g>
<g class="step" style="animation-delay:0.10s">
<rect class="q" x="290.0" y="80.0" width="216.0" height="56.0" rx="10"/>
<rect class="qa" x="290.0" y="88.0" width="4" height="40.0" rx="2"/>
<text class="t" x="400.0" y="105.0" text-anchor="middle" style="font-size:13px">Already clipped, masked</text>
<text class="t" x="400.0" y="120.0" text-anchor="middle" style="font-size:13px">and scaled. Which sensor?</text>
</g>
<g class="step" style="animation-delay:0.15s">
<rect class="leaf" x="696.0" y="64.0" width="233.8" height="36.0" rx="10"/>
<text class="mono" x="812.9" y="86.5" text-anchor="middle">prepare_optical_for_ai(...)</text>
</g>
<g class="step" style="animation-delay:0.20s">
<rect class="leaf" x="696.0" y="116.0" width="233.8" height="36.0" rx="10"/>
<text class="mono" x="812.9" y="138.5" text-anchor="middle">prepare_sar_for_ai(...)</text>
</g>
</svg>
