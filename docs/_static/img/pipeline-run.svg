<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" role="img" aria-label="Anatomy of a pipeline run: search, select, download, mask, compute, deliver">
  <style>
    .box{fill:#fff;stroke:#1b6a9c;stroke-width:1.6;rx:10}
    .acc{stroke:#1fa37a}
    .t{font:600 14px Ubuntu,system-ui,sans-serif;fill:#1c1e21}
    .s{font:400 11.5px Ubuntu,system-ui,sans-serif;fill:#5a5c63}
    .n{font:700 12px Ubuntu,system-ui,sans-serif;fill:#1b6a9c}
    .flow{stroke:#1b6a9c;stroke-width:2;fill:none;stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-12}}
    @media (prefers-color-scheme:dark){.box{fill:#242526;stroke:#6cc4dd}.acc{stroke:#4cd1a1}.t{fill:#e3e3e3}.s{fill:#b0b3b8}.n{fill:#6cc4dd}.flow{stroke:#6cc4dd}}
    @media (prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>

  <rect class="box" x="10" y="30" width="135" height="96"/><text class="n" x="22" y="50">1</text><text class="t" x="78" y="72" text-anchor="middle">Search</text>
  <text class="s" x="78" y="90" text-anchor="middle">open catalogues,</text>
  <text class="s" x="78" y="104" text-anchor="middle">cached for an</text>
  <text class="s" x="78" y="118" text-anchor="middle">hour</text>
  <path class="flow" d="M145 78 H179"/>
  <rect class="box" x="179" y="30" width="135" height="96"/><text class="n" x="191" y="50">2</text><text class="t" x="246" y="72" text-anchor="middle">Select</text>
  <text class="s" x="246" y="90" text-anchor="middle">clearest scenes</text>
  <text class="s" x="246" y="104" text-anchor="middle">covering the box</text>
  <text class="s" x="246" y="118" text-anchor="middle">(cloud limit)</text>
  <path class="flow" d="M314 78 H348"/>
  <rect class="box" x="348" y="30" width="135" height="96"/><text class="n" x="360" y="50">3</text><text class="t" x="416" y="72" text-anchor="middle">Download</text>
  <text class="s" x="416" y="90" text-anchor="middle">only the bands</text>
  <text class="s" x="416" y="104" text-anchor="middle">the method</text>
  <text class="s" x="416" y="118" text-anchor="middle">needs</text>
  <path class="flow" d="M483 78 H517"/>
  <rect class="box" x="517" y="30" width="135" height="96"/><text class="n" x="529" y="50">4</text><text class="t" x="584" y="72" text-anchor="middle">Mask</text>
  <text class="s" x="584" y="90" text-anchor="middle">cloud, shadow,</text>
  <text class="s" x="584" y="104" text-anchor="middle">no-data become</text>
  <text class="s" x="584" y="118" text-anchor="middle">255 or NaN</text>
  <path class="flow" d="M652 78 H686"/>
  <rect class="box" x="686" y="30" width="135" height="96"/><text class="n" x="698" y="50">5</text><text class="t" x="754" y="72" text-anchor="middle">Compute</text>
  <text class="s" x="754" y="90" text-anchor="middle">documented index</text>
  <text class="s" x="754" y="104" text-anchor="middle">or your</text>
  <text class="s" x="754" y="118" text-anchor="middle">trained network</text>
  <path class="flow" d="M821 78 H855"/>
  <rect class="box acc" x="855" y="30" width="135" height="96"/><text class="n" x="867" y="50">6</text><text class="t" x="922" y="72" text-anchor="middle">Deliver</text>
  <text class="s" x="922" y="90" text-anchor="middle">rasters, vectors,</text>
  <text class="s" x="922" y="104" text-anchor="middle">map, tables,</text>
  <text class="s" x="922" y="118" text-anchor="middle">run_summary.json</text>
</svg>
