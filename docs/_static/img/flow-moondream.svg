<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 197" role="img" aria-label="Moondream workflow: raster to RGB picture, with or without a question, to the model, text comes out"><title>Moondream workflow: raster to RGB picture, with or without a question, to the model, text comes out</title>
  <style>
    :root{--card:#ffffff;--line:#d7dbe0;--title:#1c1e21;--sub:#5a5c63;--pill:#eef3f8;--pillt:#1b4f72;--flow:#1b6a9c;--soft:#f6f8fa;--shadow:rgba(16,24,40,.10)}
    @media (prefers-color-scheme:dark){:root{--card:#242526;--line:#3a3b3d;--title:#e8e8e8;--sub:#b0b3b8;--pill:#2f3a44;--pillt:#a9d6ee;--flow:#6cc4dd;--soft:#1d1e1f;--shadow:rgba(0,0,0,.45)}}
    text{font-family:Ubuntu,"Segoe UI",system-ui,sans-serif}
    .card{fill:var(--card);stroke:var(--line);stroke-width:1.2;filter:drop-shadow(0 2px 3px var(--shadow))}
    .side{fill:var(--soft);stroke:var(--flow);stroke-width:1.3;stroke-dasharray:5 4}
    .t{font-weight:600;font-size:14px;fill:var(--title)}
    .s{font-size:11.5px;fill:var(--sub)}
    .n{font-weight:700;font-size:12px;fill:#fff}
    .pill{fill:var(--pill)}
    .cmd{font-family:"Ubuntu Mono",ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:var(--pillt)}
    .arrow{stroke:var(--flow);stroke-width:2;fill:none;stroke-dasharray:6 6;animation:dash 1.1s linear infinite}
    .head{fill:var(--flow)}
    .step{animation:rise .6s ease-out both}
    .q{fill:var(--card);stroke:var(--line);stroke-width:1.2;filter:drop-shadow(0 2px 3px var(--shadow))}
    .leaf{fill:var(--pill);stroke:var(--flow);stroke-width:1.2}
    .qa{fill:#1b6a9c}
    .mono{font-family:"Ubuntu Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;fill:var(--pillt);font-weight:600}
    .lab{font-size:10.5px;font-weight:700;fill:var(--flow)}
    .labbg{fill:var(--card);stroke:var(--flow);stroke-width:1}
    .band{fill:var(--card);stroke:var(--line);stroke-width:1.2;filter:drop-shadow(0 2px 3px var(--shadow))}
    .bt{font-weight:700;font-size:15px;fill:#fff}
    .bs{font-size:11.5px;fill:rgba(255,255,255,.86)}
    .quote{font-size:12px;font-style:italic;fill:var(--sub)}
    .a0{fill:#1b6a9c}.a1{fill:#2386b0}.a2{fill:#1f9bb0}.a3{fill:#23a58e}.a4{fill:#3aa66b}.a5{fill:#6aa84f}
    @keyframes dash{to{stroke-dashoffset:-12}}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.arrow{animation:none}.step{animation:none}}
  </style>
<g class="step" style="animation-delay:0.00s">
<rect class="card" x="18.0" y="18" width="176.8" height="163" rx="12"/>
<circle class="a0" cx="106.4" cy="42" r="13"/>
<text class="n" x="106.4" y="46.2" text-anchor="middle">1</text>
<text class="t" x="106.4" y="84" text-anchor="middle">Raster</text>
<text class="s" x="106.4" y="104" text-anchor="middle">A GeoTIFF or an</text>
<text class="s" x="106.4" y="119" text-anchor="middle">ordinary picture</text>
</g>
<path class="arrow" d="M197.8 42 H217.8"/><path class="head" d="M218.8 37 L225.8 42 L218.8 47 Z"/>
<g class="step" style="animation-delay:0.12s">
<rect class="card" x="224.8" y="18" width="176.8" height="163" rx="12"/>
<circle class="a1" cx="313.2" cy="42" r="13"/>
<text class="n" x="313.2" y="46.2" text-anchor="middle">2</text>
<text class="t" x="313.2" y="84" text-anchor="middle">Picture</text>
<text class="s" x="313.2" y="104" text-anchor="middle">Three bands, shared</text>
<text class="s" x="313.2" y="119" text-anchor="middle">stretch, nodata black</text>
<rect class="pill" x="251.7" y="153" width="123.0" height="20" rx="10"/>
<text class="cmd" x="313.2" y="167" text-anchor="middle">bands=(3, 2, 1)</text>
</g>
<path class="arrow" d="M404.6 42 H424.6"/><path class="head" d="M425.6 37 L432.6 42 L425.6 47 Z"/>
<g class="step" style="animation-delay:0.24s">
<rect class="card" x="431.6" y="18" width="176.8" height="163" rx="12"/>
<circle class="a2" cx="520.0" cy="42" r="13"/>
<text class="n" x="520.0" y="46.2" text-anchor="middle">3</text>
<text class="t" x="520.0" y="84" text-anchor="middle">Question</text>
<text class="s" x="520.0" y="104" text-anchor="middle">None for a caption;</text>
<text class="s" x="520.0" y="119" text-anchor="middle">a closed question</text>
<text class="s" x="520.0" y="134" text-anchor="middle">for an answer</text>
<rect class="pill" x="465.5" y="153" width="109.0" height="20" rx="10"/>
<text class="cmd" x="520.0" y="167" text-anchor="middle">caption | vqa</text>
</g>
<path class="arrow" d="M611.4 42 H631.4"/><path class="head" d="M632.4 37 L639.4 42 L632.4 47 Z"/>
<g class="step" style="animation-delay:0.36s">
<rect class="card" x="638.4" y="18" width="176.8" height="163" rx="12"/>
<circle class="a3" cx="726.8" cy="42" r="13"/>
<text class="n" x="726.8" y="46.2" text-anchor="middle">4</text>
<text class="t" x="726.8" y="84" text-anchor="middle">Moondream2</text>
<text class="s" x="726.8" y="104" text-anchor="middle">About 1.8 B</text>
<text class="s" x="726.8" y="119" text-anchor="middle">parameters, pinned</text>
<text class="s" x="726.8" y="134" text-anchor="middle">revision</text>
<rect class="pill" x="682.8" y="153" width="88.0" height="20" rx="10"/>
<text class="cmd" x="726.8" y="167" text-anchor="middle">2025-06-21</text>
</g>
<path class="arrow" d="M818.2 42 H838.2"/><path class="head" d="M839.2 37 L846.2 42 L839.2 47 Z"/>
<g class="step" style="animation-delay:0.48s">
<rect class="card" x="845.2" y="18" width="176.8" height="163" rx="12"/>
<circle class="a4" cx="933.6" cy="42" r="13"/>
<text class="n" x="933.6" y="46.2" text-anchor="middle">5</text>
<text class="t" x="933.6" y="84" text-anchor="middle">Text</text>
<text class="s" x="933.6" y="104" text-anchor="middle">A sentence or a</text>
<text class="s" x="933.6" y="119" text-anchor="middle">short answer: a note</text>
<text class="s" x="933.6" y="134" text-anchor="middle">for a person</text>
</g>
</svg>
