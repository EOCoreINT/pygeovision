<rect class="labbg" x="221.0" y="295.0" width="154.0" height="18" rx="9"/><text class="lab" x="298.0" y="308.0" text-anchor="middle">a few hundred labels</text>
<path class="arrow" d="M589.0 304.0 H607.0 V196.0 H898.0"/><path class="head" d="M897.0 191.0 L905.0 196.0 L897.0 201.0 Z"/>
<rect class="labbg" x="699.5" y="187.0" width="105.0" height="18" rx="9"/><text class="lab" x="752.0" y="200.0" text-anchor="middle">six HLS bands</text>
<path class="arrow" d="M589.0 304.0 H607.0 V268.0 H898.0"/><path class="head" d="M897.0 263.0 L905.0 268.0 L897.0 273.0 Z"/>
<rect class="labbg" x="678.5" y="259.0" width="147.0" height="18" rx="9"/><text class="lab" x="752.0" y="272.0" text-anchor="middle">any sensor or bands</text>
<path class="arrow" d="M589.0 304.0 H607.0 V340.0 H898.0"/><path class="head" d="M897.0 335.0 L905.0 340.0 L897.0 345.0 Z"/>
<rect class="labbg" x="692.5" y="331.0" width="119.0" height="18" rx="9"/><text class="lab" x="752.0" y="344.0" text-anchor="middle">ordinary colour</text>
<path class="arrow" d="M589.0 304.0 H607.0 V412.0 H898.0"/><path class="head" d="M897.0 407.0 L905.0 412.0 L897.0 417.0 Z"/>
<rect class="labbg" x="727.5" y="403.0" width="49.0" height="18" rx="9"/><text class="lab" x="752.0" y="416.0" text-anchor="middle">radar</text>
