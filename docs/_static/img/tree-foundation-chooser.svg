<rect class="qa" x="415.0" y="294.0" width="4" height="20.0" rx="2"/>
<text class="t" x="504.0" y="308.5" text-anchor="middle" style="font-size:13px">Which imagery?</text>
</g>
<g class="step" style="animation-delay:0.30s">
<rect class="leaf" x="905.0" y="168.0" width="159.8" height="56.0" rx="10"/>
<text class="mono" x="984.9" y="193.0" text-anchor="middle">Prithvi-EO</text>
<text class="mono" x="984.9" y="208.0" text-anchor="middle">train a head</text>
