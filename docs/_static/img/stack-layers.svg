<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 370" role="img" aria-label="PyGeoVision in three layers: the data layer at the bottom, the AI layer above it, the task layer on top"><title>PyGeoVision in three layers: the data layer at the bottom, the AI layer above it, the task layer on top</title>
  <style>
    :root{--card:#ffffff;--line:#d7dbe0;--title:#1c1e21;--sub:#5a5c63;--pill:#eef3f8;--pillt:#1b4f72;--flow:#1b6a9c;--soft:#f6f8fa;--shadow:rgba(16,24,40,.10)}
    @media (prefers-color-scheme:dark){:root{--card:#242526;--line:#3a3b3d;--title:#e8e8e8;--sub:#b0b3b8;--pill:#2f3a44;--pillt:#a9d6ee;--flow:#6cc4dd;--soft:#1d1e1f;--shadow:rgba(0,0,0,.45)}}
    text{font-family:Ubuntu,"Segoe UI",system-ui,sans-serif}
    .card{fill:var(--card);stroke:var(--line);stroke-width:1.2;filter:drop-shadow(0 2px 3px var(--shadow))}
    .side{fill:var(--soft);stroke:var(--flow);stroke-width:1.3;stroke-dasharray:5 4}
    .t{font-weight:600;font-size:14px;fill:var(--title)}
    .s{font-size:11.5px;fill:var(--sub)}
    .n{font-weight:700;font-size:12px;fill:#fff}
    .pill{fill:var(--pill)}
    .cmd{font-family:"Ubuntu Mono",ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:var(--pillt)}
    .arrow{stroke:var(--flow);stroke-width:2;fill:none;stroke-dasharray:6 6;animation:dash 1.1s linear infinite}
    .head{fill:var(--flow)}
    .step{animation:rise .6s ease-out both}
    .q{fill:var(--card);stroke:var(--line);stroke-width:1.2;filter:drop-shadow(0 2px 3px var(--shadow))}
    .leaf{fill:var(--pill);stroke:var(--flow);stroke-width:1.2}
    .qa{fill:#1b6a9c}
    .mono{font-family:"Ubuntu Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;fill:var(--pillt);font-weight:600}
    .lab{font-size:10.5px;font-weight:700;fill:var(--flow)}
    .labbg{fill:var(--card);stroke:var(--flow);stroke-width:1}
    .band{fill:var(--card);stroke:var(--line);stroke-width:1.2;filter:drop-shadow(0 2px 3px var(--shadow))}
    .bt{font-weight:700;font-size:15px;fill:#fff}
    .bs{font-size:11.5px;fill:rgba(255,255,255,.86)}
    .quote{font-size:12px;font-style:italic;fill:var(--sub)}
    .a0{fill:#1b6a9c}.a1{fill:#2386b0}.a2{fill:#1f9bb0}.a3{fill:#23a58e}.a4{fill:#3aa66b}.a5{fill:#6aa84f}
    @keyframes dash{to{stroke-dashoffset:-12}}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.arrow{animation:none}.step{animation:none}}
  </style>
<g class="step" style="animation-delay:0.00s">
<rect class="band" x="18" y="12" width="1004" height="98" rx="14"/>
<path class="a0" d="M32 12 H228 V110 H32 A14 14 0 0 1 18 96 V26 A14 14 0 0 1 32 12 Z"/>
<text class="bt" x="123.0" y="52" text-anchor="middle">3  Task layer</text>
<text class="bs" x="123.0" y="74" text-anchor="middle">finished products</text>
<text class="s" x="256" y="44" style="font-size:12.5px">41 pipelines  ·  reporting  ·  the command line (channel, report)</text>
<text class="quote" x="256" y="94">“give me flood extent for this box and this date”</text></g>
<path class="arrow" d="M498.0 134.0 V115.0"/><path class="head" d="M493.0 116.0 L498.0 110.0 L503.0 116.0 Z"/>
<path class="arrow" d="M542.0 134.0 V115.0"/><path class="head" d="M537.0 116.0 L542.0 110.0 L547.0 116.0 Z"/>
<g class="step" style="animation-delay:0.15s">
<rect class="band" x="18" y="136" width="1004" height="98" rx="14"/>
<path class="a2" d="M32 136 H228 V234 H32 A14 14 0 0 1 18 220 V150 A14 14 0 0 1 32 136 Z"/>
<text class="bt" x="123.0" y="176" text-anchor="middle">2  AI layer</text>
<text class="bs" x="123.0" y="198" text-anchor="middle">optional: needs PyTorch</text>
<text class="s" x="256" y="168" style="font-size:12.5px">Model registry  ·  training  ·  tiled inference  ·  labelling</text>
<text class="s" x="256" y="183" style="font-size:12.5px">OBIA  ·  explainability  ·  monitoring  ·  edge  ·  cloud</text>
<text class="quote" x="256" y="218">“train, run, explain or ship a network”</text></g>
<path class="arrow" d="M498.0 258.0 V239.0"/><path class="head" d="M493.0 240.0 L498.0 234.0 L503.0 240.0 Z"/>
<path class="arrow" d="M542.0 258.0 V239.0"/><path class="head" d="M537.0 240.0 L542.0 234.0 L547.0 240.0 Z"/>
<g class="step" style="animation-delay:0.30s">
<rect class="band" x="18" y="260" width="1004" height="98" rx="14"/>
<path class="a4" d="M32 260 H228 V358 H32 A14 14 0 0 1 18 344 V274 A14 14 0 0 1 32 260 Z"/>
<text class="bt" x="123.0" y="300" text-anchor="middle">1  Data layer</text>
<text class="bs" x="123.0" y="322" text-anchor="middle">always available</text>
<text class="s" x="256" y="292" style="font-size:12.5px">22 providers (through pygeofetch)  ·  reference products</text>
<text class="s" x="256" y="307" style="font-size:12.5px">Spectral indices  ·  radiometry  ·  scene selection</text>
<text class="quote" x="256" y="342">“find, download and calibrate imagery”</text></g>
</svg>
