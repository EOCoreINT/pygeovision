<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 642 360" role="img" aria-label="Choosing a vision-language tool: ranking many tiles by a description leads to CLIP; a sentence or an answer about one tile leads to Moondream; a mask from words is not available"><title>Choosing a vision-language tool: ranking many tiles by a description leads to CLIP; a sentence or an answer about one tile leads to Moondream; a mask from words is not available</title>
  <style>
    :root{--card:#ffffff;--line:#d7dbe0;--title:#1c1e21;--sub:#5a5c63;--pill:#eef3f8;--pillt:#1b4f72;--flow:#1b6a9c;--soft:#f6f8fa;--shadow:rgba(16,24,40,.10)}
    @media (prefers-color-scheme:dark){:root{--card:#242526;--line:#3a3b3d;--title:#e8e8e8;--sub:#b0b3b8;--pill:#2f3a44;--pillt:#a9d6ee;--flow:#6cc4dd;--soft:#1d1e1f;--shadow:rgba(0,0,0,.45)}}
    text{font-family:Ubuntu,"Segoe UI",system-ui,sans-serif}
    .card{fill:var(--card);stroke:var(--line);stroke-width:1.2;filter:drop-shadow(0 2px 3px var(--shadow))}
    .side{fill:var(--soft);stroke:var(--flow);stroke-width:1.3;stroke-dasharray:5 4}
    .t{font-weight:600;font-size:14px;fill:var(--title)}
    .s{font-size:11.5px;fill:var(--sub)}
    .n{font-weight:700;font-size:12px;fill:#fff}
    .pill{fill:var(--pill)}
    .cmd{font-family:"Ubuntu Mono",ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:var(--pillt)}
    .arrow{stroke:var(--flow);stroke-width:2;fill:none;stroke-dasharray:6 6;animation:dash 1.1s linear infinite}
    .head{fill:var(--flow)}
    .step{animation:rise .6s ease-out both}
    .q{fill:var(--card);stroke:var(--line);stroke-width:1.2;filter:drop-shadow(0 2px 3px var(--shadow))}
    .leaf{fill:var(--pill);stroke:var(--flow);stroke-width:1.2}
    .qa{fill:#1b6a9c}
    .mono{font-family:"Ubuntu Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;fill:var(--pillt);font-weight:600}
    .lab{font-size:10.5px;font-weight:700;fill:var(--flow)}
    .labbg{fill:var(--card);stroke:var(--flow);stroke-width:1}
    .band{fill:var(--card);stroke:var(--line);stroke-width:1.2;filter:drop-shadow(0 2px 3px var(--shadow))}
    .bt{font-weight:700;font-size:15px;fill:#fff}
    .bs{font-size:11.5px;fill:rgba(255,255,255,.86)}
    .quote{font-size:12px;font-style:italic;fill:var(--sub)}
    .a0{fill:#1b6a9c}.a1{fill:#2386b0}.a2{fill:#1f9bb0}.a3{fill:#23a58e}.a4{fill:#3aa66b}.a5{fill:#6aa84f}
    @keyframes dash{to{stroke-dashoffset:-12}}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.arrow{animation:none}.step{animation:none}}
  </style>
<path class="arrow" d="M164.0 185.0 H182.0 V40.0 H428.0"/><path class="head" d="M427.0 35.0 L435.0 40.0 L427.0 45.0 Z"/>
<rect class="labbg" x="224.0" y="31.0" width="161.0" height="18" rx="9"/><text class="lab" x="304.5" y="44.0" text-anchor="middle">tiles ranked by words</text>
<path class="arrow" d="M164.0 185.0 H182.0 V102.0 H428.0"/><path class="head" d="M427.0 97.0 L435.0 102.0 L427.0 107.0 Z"/>
<rect class="labbg" x="234.5" y="93.0" width="140.0" height="18" rx="9"/><text class="lab" x="304.5" y="106.0" text-anchor="middle">a label for a tile</text>
<path class="arrow" d="M164.0 185.0 H182.0 V154.0 H428.0"/><path class="head" d="M427.0 149.0 L435.0 154.0 L427.0 159.0 Z"/>
<rect class="labbg" x="217.0" y="145.0" width="175.0" height="18" rx="9"/><text class="lab" x="304.5" y="158.0" text-anchor="middle">a sentence about a tile</text>
<path class="arrow" d="M164.0 185.0 H182.0 V206.0 H428.0"/><path class="head" d="M427.0 201.0 L435.0 206.0 L427.0 211.0 Z"/>
<rect class="labbg" x="220.5" y="197.0" width="168.0" height="18" rx="9"/><text class="lab" x="304.5" y="210.0" text-anchor="middle">an answer about a tile</text>
<path class="arrow" d="M164.0 185.0 H182.0 V268.0 H428.0"/><path class="head" d="M427.0 263.0 L435.0 268.0 L427.0 273.0 Z"/>
<rect class="labbg" x="238.0" y="259.0" width="133.0" height="18" rx="9"/><text class="lab" x="304.5" y="272.0" text-anchor="middle">a mask from words</text>
<path class="arrow" d="M164.0 185.0 H182.0 V330.0 H428.0"/><path class="head" d="M427.0 325.0 L435.0 330.0 L427.0 335.0 Z"/>
<rect class="labbg" x="269.5" y="321.0" width="70.0" height="18" rx="9"/><text class="lab" x="304.5" y="334.0" text-anchor="middle">a number</text>
<g class="step" style="animation-delay:0.00s">
<rect class="q" x="18.0" y="157.0" width="146.0" height="56.0" rx="10"/>
<rect class="qa" x="18.0" y="165.0" width="4" height="40.0" rx="2"/>
<text class="t" x="93.0" y="182.0" text-anchor="middle" style="font-size:13px">What do you need</text>
<text class="t" x="93.0" y="197.0" text-anchor="middle" style="font-size:13px">back?</text>
</g>
<g class="step" style="animation-delay:0.05s">
<rect class="leaf" x="435.0" y="12.0" width="189.4" height="56.0" rx="10"/>
<text class="mono" x="529.7" y="37.0" text-anchor="middle">CLIPGeo.search</text>
<text class="mono" x="529.7" y="52.0" text-anchor="middle">GeoImageRetrieval</text>
</g>
<g class="step" style="animation-delay:0.10s">
<rect class="leaf" x="435.0" y="84.0" width="189.4" height="36.0" rx="10"/>
<text class="mono" x="529.7" y="106.5" text-anchor="middle">CLIPGeo.zero_shot</text>
</g>
<g class="step" style="animation-delay:0.15s">
<rect class="leaf" x="435.0" y="136.0" width="189.4" height="36.0" rx="10"/>
<text class="mono" x="529.7" y="158.5" text-anchor="middle">MoondreamGeo.caption</text>
</g>
<g class="step" style="animation-delay:0.20s">
<rect class="leaf" x="435.0" y="188.0" width="189.4" height="36.0" rx="10"/>
<text class="mono" x="529.7" y="210.5" text-anchor="middle">MoondreamGeo.vqa</text>
</g>
<g class="step" style="animation-delay:0.25s">
<rect class="leaf" x="435.0" y="240.0" width="189.4" height="56.0" rx="10"/>
<text class="mono" x="529.7" y="265.0" text-anchor="middle">not available here</text>
<text class="mono" x="529.7" y="280.0" text-anchor="middle">SAM + CLIP by hand</text>
</g>
<g class="step" style="animation-delay:0.30s">
<rect class="leaf" x="435.0" y="312.0" width="189.4" height="36.0" rx="10"/>
<text class="mono" x="529.7" y="334.5" text-anchor="middle">a pipeline, not a VLM</text>
</g>
</svg>
