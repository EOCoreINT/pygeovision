<circle class="a4" cx="778.5" cy="42" r="13"/>
<text class="n" x="778.5" y="46.2" text-anchor="middle">5</text>
<text class="t" x="778.5" y="84" text-anchor="middle">Test</text>
<text class="s" x="778.5" y="104" text-anchor="middle">Send a chip, read</text>
<text class="s" x="778.5" y="119" text-anchor="middle">predictions</text>
<rect class="pill" x="738.0" y="153" width="81.0" height="20" rx="10"/>
<text class="cmd" x="778.5" y="167" text-anchor="middle">predict()</text>
