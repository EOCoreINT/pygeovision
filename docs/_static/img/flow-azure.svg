<text class="n" x="950.8" y="46.2" text-anchor="middle">6</text>
<text class="t" x="950.8" y="84" text-anchor="middle">Delete</text>
<text class="s" x="950.8" y="104" text-anchor="middle">Stop the hourly</text>
<text class="s" x="950.8" y="119" text-anchor="middle">charge when done</text>
<rect class="pill" x="889.3" y="153" width="123.0" height="20" rx="10"/>
<text class="cmd" x="950.8" y="167" text-anchor="middle">delete_endpoint</text>
</g>
<path class="arrow" d="M606.2 213 V187"/><path class="head" d="M601.2 188 L606.2 181 L611.2 188 Z"/>
<g class="step" style="animation-delay:0.84s"><rect class="side" x="448.8" y="215" width="314.7" height="61" rx="12"/><text class="t" x="606.2" y="239" text-anchor="middle">Not covered by the shipped deploy()</text><text class="s" x="606.2" y="258" text-anchor="middle">The scoring script and environment</text></g>
</svg>
