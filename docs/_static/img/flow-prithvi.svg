<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 275" role="img" aria-label="Using Prithvi-EO: prepare six HLS bands as reflectance, load the encoder, take features or build a segmentation head, train the head on labels, run a task, check against reference data"><title>Using Prithvi-EO: prepare six HLS bands as reflectance, load the encoder, take features or build a segmentation head, train the head on labels, run a task, check against reference data</title>
  <style>
    :root{--card:#ffffff;--line:#d7dbe0;--title:#1c1e21;--sub:#5a5c63;--pill:#eef3f8;--pillt:#1b4f72;--flow:#1b6a9c;--soft:#f6f8fa;--shadow:rgba(16,24,40,.10)}
    @media (prefers-color-scheme:dark){:root{--card:#242526;--line:#3a3b3d;--title:#e8e8e8;--sub:#b0b3b8;--pill:#2f3a44;--pillt:#a9d6ee;--flow:#6cc4dd;--soft:#1d1e1f;--shadow:rgba(0,0,0,.45)}}
    text{font-family:Ubuntu,"Segoe UI",system-ui,sans-serif}
    .card{fill:var(--card);stroke:var(--line);stroke-width:1.2;filter:drop-shadow(0 2px 3px var(--shadow))}
    .side{fill:var(--soft);stroke:var(--flow);stroke-width:1.3;stroke-dasharray:5 4}
    .t{font-weight:600;font-size:14px;fill:var(--title)}
    .s{font-size:11.5px;fill:var(--sub)}
    .n{font-weight:700;font-size:12px;fill:#fff}
    .pill{fill:var(--pill)}
    .cmd{font-family:"Ubuntu Mono",ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:var(--pillt)}
    .arrow{stroke:var(--flow);stroke-width:2;fill:none;stroke-dasharray:6 6;animation:dash 1.1s linear infinite}
    .head{fill:var(--flow)}
    .step{animation:rise .6s ease-out both}
    .q{fill:var(--card);stroke:var(--line);stroke-width:1.2;filter:drop-shadow(0 2px 3px var(--shadow))}
    .leaf{fill:var(--pill);stroke:var(--flow);stroke-width:1.2}
    .qa{fill:#1b6a9c}
    .mono{font-family:"Ubuntu Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;fill:var(--pillt);font-weight:600}
    .lab{font-size:10.5px;font-weight:700;fill:var(--flow)}
    .labbg{fill:var(--card);stroke:var(--flow);stroke-width:1}
    .band{fill:var(--card);stroke:var(--line);stroke-width:1.2;filter:drop-shadow(0 2px 3px var(--shadow))}
    .bt{font-weight:700;font-size:15px;fill:#fff}
    .bs{font-size:11.5px;fill:rgba(255,255,255,.86)}
    .quote{font-size:12px;font-style:italic;fill:var(--sub)}
    .a0{fill:#1b6a9c}.a1{fill:#2386b0}.a2{fill:#1f9bb0}.a3{fill:#23a58e}.a4{fill:#3aa66b}.a5{fill:#6aa84f}
    @keyframes dash{to{stroke-dashoffset:-12}}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.arrow{animation:none}.step{animation:none}}
  </style>
<g class="step" style="animation-delay:0.00s">
<rect class="card" x="18.0" y="18" width="142.3" height="148" rx="12"/>
<circle class="a0" cx="89.2" cy="42" r="13"/>
<text class="n" x="89.2" y="46.2" text-anchor="middle">1</text>
<text class="t" x="89.2" y="84" text-anchor="middle">Prepare</text>
<text class="s" x="89.2" y="104" text-anchor="middle">Six HLS bands as</text>
<text class="s" x="89.2" y="119" text-anchor="middle">reflectance 0 to 1</text>
<rect class="pill" x="31.2" y="138" width="116.0" height="20" rx="10"/>
<text class="cmd" x="89.2" y="152" text-anchor="middle">prepare_for_ai</text>
</g>
<path class="arrow" d="M163.3 42 H183.3"/><path class="head" d="M184.3 37 L191.3 42 L184.3 47 Z"/>
<g class="step" style="animation-delay:0.12s">
<rect class="card" x="190.3" y="18" width="142.3" height="148" rx="12"/>
<circle class="a1" cx="261.5" cy="42" r="13"/>
<text class="n" x="261.5" y="46.2" text-anchor="middle">2</text>
<text class="t" x="261.5" y="84" text-anchor="middle">Load</text>
<text class="s" x="261.5" y="104" text-anchor="middle">Pinned download from</text>
<text class="s" x="261.5" y="119" text-anchor="middle">the Hub, or local files</text>
<rect class="pill" x="198.3" y="138" width="126.3" height="20" rx="10"/>
<text class="cmd" x="261.5" y="152" text-anchor="middle">Prithvi().load()</text>
</g>
<path class="arrow" d="M335.7 42 H355.7"/><path class="head" d="M356.7 37 L363.7 42 L356.7 47 Z"/>
<g class="step" style="animation-delay:0.24s">
<rect class="card" x="362.7" y="18" width="142.3" height="148" rx="12"/>
<circle class="a2" cx="433.8" cy="42" r="13"/>
<text class="n" x="433.8" y="46.2" text-anchor="middle">3</text>
<text class="t" x="433.8" y="84" text-anchor="middle">Features</text>
<text class="s" x="433.8" y="104" text-anchor="middle">Scene vector, or one</text>
<text class="s" x="433.8" y="119" text-anchor="middle">vector per 16 px patch</text>
<rect class="pill" x="370.7" y="138" width="126.3" height="20" rx="10"/>
<text class="cmd" x="433.8" y="152" text-anchor="middle">extract_features</text>
</g>
<path class="arrow" d="M508.0 42 H528.0"/><path class="head" d="M529.0 37 L536.0 42 L529.0 47 Z"/>
<g class="step" style="animation-delay:0.36s">
<rect class="card" x="535.0" y="18" width="142.3" height="148" rx="12"/>
<circle class="a3" cx="606.2" cy="42" r="13"/>
<text class="n" x="606.2" y="46.2" text-anchor="middle">4</text>
<text class="t" x="606.2" y="84" text-anchor="middle">Head</text>
<text class="s" x="606.2" y="104" text-anchor="middle">Random conv head on</text>
<text class="s" x="606.2" y="119" text-anchor="middle">the frozen encoder</text>
<rect class="pill" x="569.2" y="138" width="74.0" height="20" rx="10"/>
<text class="cmd" x="606.2" y="152" text-anchor="middle">seg head</text>
</g>
<path class="arrow" d="M680.3 42 H700.3"/><path class="head" d="M701.3 37 L708.3 42 L701.3 47 Z"/>
<g class="step" style="animation-delay:0.48s">
<rect class="card" x="707.3" y="18" width="142.3" height="148" rx="12"/>
<circle class="a4" cx="778.5" cy="42" r="13"/>
<text class="n" x="778.5" y="46.2" text-anchor="middle">5</text>
<text class="t" x="778.5" y="84" text-anchor="middle">Train</text>
<text class="s" x="778.5" y="104" text-anchor="middle">Your labels, your</text>
<text class="s" x="778.5" y="119" text-anchor="middle">GeoTrainer run</text>
<rect class="pill" x="715.3" y="138" width="126.3" height="20" rx="10"/>
<text class="cmd" x="778.5" y="152" text-anchor="middle">save_prithvi_head</text>
</g>
<path class="arrow" d="M852.7 42 H872.7"/><path class="head" d="M873.7 37 L880.7 42 L873.7 47 Z"/>
<g class="step" style="animation-delay:0.60s">
<rect class="card" x="879.7" y="18" width="142.3" height="148" rx="12"/>
<circle class="a5" cx="950.8" cy="42" r="13"/>
<text class="n" x="950.8" y="46.2" text-anchor="middle">6</text>
<text class="t" x="950.8" y="84" text-anchor="middle">Run</text>
<text class="s" x="950.8" y="104" text-anchor="middle">Task output, with</text>
<text class="s" x="950.8" y="119" text-anchor="middle">the method named</text>
<rect class="pill" x="899.8" y="138" width="102.0" height="20" rx="10"/>
<text class="cmd" x="950.8" y="152" text-anchor="middle">PrithviTasks</text>
</g>
<path class="arrow" d="M950.8 198 V172"/><path class="head" d="M945.8 173 L950.8 166 L955.8 173 Z"/>
<g class="step" style="animation-delay:0.84s"><rect class="side" x="707.3" y="200" width="314.7" height="61" rx="12"/><text class="t" x="864.7" y="224" text-anchor="middle">No head: rules, not Prithvi</text><text class="s" x="864.7" y="243" text-anchor="middle">result[&quot;method&quot;] says which ran</text></g>
</svg>
