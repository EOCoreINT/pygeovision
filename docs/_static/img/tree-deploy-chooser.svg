<text class="t" x="543.0" y="181.0" text-anchor="middle" style="font-size:13px">Which cloud do you</text>
<text class="t" x="543.0" y="196.0" text-anchor="middle" style="font-size:13px">already pay for?</text>
</g>
<g class="step" style="animation-delay:0.15s">
<rect class="leaf" x="818.0" y="84.0" width="182.0" height="56.0" rx="10"/>
<text class="mono" x="909.0" y="109.0" text-anchor="middle">SageMaker</text>
<text class="mono" x="909.0" y="124.0" text-anchor="middle">most complete path</text>
</g>
<g class="step" style="animation-delay:0.20s">
<rect class="leaf" x="818.0" y="156.0" width="182.0" height="56.0" rx="10"/>
<text class="mono" x="909.0" y="181.0" text-anchor="middle">Azure ML</text>
<text class="mono" x="909.0" y="196.0" text-anchor="middle">add a scoring script</text>
</g>
<g class="step" style="animation-delay:0.25s">
<rect class="leaf" x="818.0" y="228.0" width="182.0" height="56.0" rx="10"/>
<text class="mono" x="909.0" y="253.0" text-anchor="middle">Vertex AI</text>
<text class="mono" x="909.0" y="268.0" text-anchor="middle">add a container</text>
</g>
<g class="step" style="animation-delay:0.30s">
<rect class="q" x="454.0" y="326.0" width="174.0" height="36.0" rx="10"/>
<rect class="qa" x="454.0" y="334.0" width="4" height="20.0" rx="2"/>
<text class="t" x="543.0" y="348.5" text-anchor="middle" style="font-size:13px">What hardware?</text>
</g>
<g class="step" style="animation-delay:0.35s">
<rect class="leaf" x="818.0" y="300.0" width="182.0" height="36.0" rx="10"/>
<text class="mono" x="909.0" y="322.5" text-anchor="middle">ONNX Runtime</text>
</g>
<g class="step" style="animation-delay:0.40s">
<rect class="leaf" x="818.0" y="352.0" width="182.0" height="36.0" rx="10"/>
<text class="mono" x="909.0" y="374.5" text-anchor="middle">TensorRT engine</text>
</g>
</svg>
