<text class="mono" x="541.0" y="52.0" text-anchor="middle">no deployment needed</text>
</g>
<g class="step" style="animation-delay:0.10s">
<rect class="q" x="454.0" y="156.0" width="174.0" height="56.0" rx="10"/>
