<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1018 400" role="img" aria-label="Choosing where to run a trained model: one-off or batch scenes use tiled inference; an app needing a web address uses a cloud endpoint on AWS, Azure or Google; a machine without PyTorch uses ONNX; an NVIDIA Jetson uses TensorRT"><title>Choosing where to run a trained model: one-off or batch scenes use tiled inference; an app needing a web address uses a cloud endpoint on AWS, Azure or Google; a machine without PyTorch uses ONNX; an NVIDIA Jetson uses TensorRT</title>
  <style>
    :root{--card:#ffffff;--line:#d7dbe0;--title:#1c1e21;--sub:#5a5c63;--pill:#eef3f8;--pillt:#1b4f72;--flow:#1b6a9c;--soft:#f6f8fa;--shadow:rgba(16,24,40,.10)}
    @media (prefers-color-scheme:dark){:root{--card:#242526;--line:#3a3b3d;--title:#e8e8e8;--sub:#b0b3b8;--pill:#2f3a44;--pillt:#a9d6ee;--flow:#6cc4dd;--soft:#1d1e1f;--shadow:rgba(0,0,0,.45)}}
    text{font-family:Ubuntu,"Segoe UI",system-ui,sans-serif}
    .card{fill:var(--card);stroke:var(--line);stroke-width:1.2;filter:drop-shadow(0 2px 3px var(--shadow))}
    .side{fill:var(--soft);stroke:var(--flow);stroke-width:1.3;stroke-dasharray:5 4}
    .t{font-weight:600;font-size:14px;fill:var(--title)}
    .s{font-size:11.5px;fill:var(--sub)}
    .n{font-weight:700;font-size:12px;fill:#fff}
    .pill{fill:var(--pill)}
    .cmd{font-family:"Ubuntu Mono",ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:var(--pillt)}
    .arrow{stroke:var(--flow);stroke-width:2;fill:none;stroke-dasharray:6 6;animation:dash 1.1s linear infinite}
    .head{fill:var(--flow)}
    .step{animation:rise .6s ease-out both}
    .q{fill:var(--card);stroke:var(--line);stroke-width:1.2;filter:drop-shadow(0 2px 3px var(--shadow))}
    .leaf{fill:var(--pill);stroke:var(--flow);stroke-width:1.2}
    .qa{fill:#1b6a9c}
    .mono{font-family:"Ubuntu Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;fill:var(--pillt);font-weight:600}
    .lab{font-size:10.5px;font-weight:700;fill:var(--flow)}
    .labbg{fill:var(--card);stroke:var(--flow);stroke-width:1}
    .band{fill:var(--card);stroke:var(--line);stroke-width:1.2;filter:drop-shadow(0 2px 3px var(--shadow))}
    .bt{font-weight:700;font-size:15px;fill:#fff}
    .bs{font-size:11.5px;fill:rgba(255,255,255,.86)}
    .quote{font-size:12px;font-style:italic;fill:var(--sub)}
    .a0{fill:#1b6a9c}.a1{fill:#2386b0}.a2{fill:#1f9bb0}.a3{fill:#23a58e}.a4{fill:#3aa66b}.a5{fill:#6aa84f}
    @keyframes dash{to{stroke-dashoffset:-12}}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.arrow{animation:none}.step{animation:none}}
  </style>
<path class="arrow" d="M192.0 192.0 H210.0 V40.0 H447.0"/><path class="head" d="M446.0 35.0 L454.0 40.0 L446.0 45.0 Z"/>
<rect class="labbg" x="275.5" y="31.0" width="105.0" height="18" rx="9"/><text class="lab" x="328.0" y="44.0" text-anchor="middle">me, on scenes</text>
<path class="arrow" d="M192.0 192.0 H210.0 V184.0 H447.0"/><path class="head" d="M446.0 179.0 L454.0 184.0 L446.0 189.0 Z"/>
<rect class="labbg" x="244.0" y="175.0" width="168.0" height="18" rx="9"/><text class="lab" x="328.0" y="188.0" text-anchor="middle">an app, by web address</text>
<path class="arrow" d="M628.0 184.0 H646.0 V112.0 H811.0"/><path class="head" d="M810.0 107.0 L818.0 112.0 L810.0 117.0 Z"/>
<rect class="labbg" x="710.5" y="103.0" width="35.0" height="18" rx="9"/><text class="lab" x="728.0" y="116.0" text-anchor="middle">AWS</text>
<path class="arrow" d="M628.0 184.0 H646.0 V184.0 H811.0"/><path class="head" d="M810.0 179.0 L818.0 184.0 L810.0 189.0 Z"/>
<rect class="labbg" x="703.5" y="175.0" width="49.0" height="18" rx="9"/><text class="lab" x="728.0" y="188.0" text-anchor="middle">Azure</text>
<path class="arrow" d="M628.0 184.0 H646.0 V256.0 H811.0"/><path class="head" d="M810.0 251.0 L818.0 256.0 L810.0 261.0 Z"/>
<rect class="labbg" x="700.0" y="247.0" width="56.0" height="18" rx="9"/><text class="lab" x="728.0" y="260.0" text-anchor="middle">Google</text>
<path class="arrow" d="M192.0 192.0 H210.0 V344.0 H447.0"/><path class="head" d="M446.0 339.0 L454.0 344.0 L446.0 349.0 Z"/>
<rect class="labbg" x="244.0" y="335.0" width="168.0" height="18" rx="9"/><text class="lab" x="328.0" y="348.0" text-anchor="middle">a machine in the field</text>
<path class="arrow" d="M628.0 344.0 H646.0 V318.0 H811.0"/><path class="head" d="M810.0 313.0 L818.0 318.0 L810.0 323.0 Z"/>
<rect class="labbg" x="672.0" y="309.0" width="112.0" height="18" rx="9"/><text class="lab" x="728.0" y="322.0" text-anchor="middle">any CPU or GPU</text>
<path class="arrow" d="M628.0 344.0 H646.0 V370.0 H811.0"/><path class="head" d="M810.0 365.0 L818.0 370.0 L810.0 375.0 Z"/>
<rect class="labbg" x="675.5" y="361.0" width="105.0" height="18" rx="9"/><text class="lab" x="728.0" y="374.0" text-anchor="middle">NVIDIA Jetson</text>
<g class="step" style="animation-delay:0.00s">
<rect class="q" x="18.0" y="174.0" width="174.0" height="36.0" rx="10"/>
<rect class="qa" x="18.0" y="182.0" width="4" height="20.0" rx="2"/>
<text class="t" x="107.0" y="196.5" text-anchor="middle" style="font-size:13px">Who calls the model?</text>
</g>
<g class="step" style="animation-delay:0.05s">
