# The Python API reference: one page per area. tools/generate_api_docs.py turns this into docs/reference/api/*.md.
# Per page: title, summary (one line, shown in the index), intro (hand-written text above the generated part),
# explained_in (links to the guide pages), modules (dotted names; "pkg.*" means every public module of the package;
# {module, names} documents exactly those names, which is how the private client proxies are included).
# Public classes and functions are found by reading the source (no imports), so the page lists exactly what is in the code.

- slug: client
  title: The client
  summary: "`PyGeoVision` and the layers on it (`client.labeling`, `client.xai`, `client.segmentation`, ...)"
  intro: |
    `PyGeoVision()` is the one object most scripts need. It searches and downloads imagery, runs the 41 pipelines, and
    carries a *layer* for each area of the package as an attribute. Layers load their heavy dependencies only when you first
    use them. Each layer is documented below under the name of the class that implements it.
  explained_in:
    - "[Python API overview](../python-api.md)"
    - "[Core concepts](../../getting-started/concepts.md)"
    - "[Quickstart](../../getting-started/quickstart.md)"
  modules:
    - module: pygeovision
      names: [PyGeoVision, _LabelingClientProxy, _ObiaClientProxy, _LossesClientProxy, _InferenceClientProxy,
              _XAIClientProxy, _MonitoringClientProxy, _EdgeClientProxy, _CloudClientProxy, _FewShotClientProxy,
              _MultiTaskClientProxy, _AutoMLClientProxy, _VLMClientProxy, _TimeSeriesClientProxy,
              _PointCloudClientProxy, _SegmentationClientProxy, _DetectionClientProxy,
              _ChangeDetectionClientProxy, _ClassificationClientProxy]

- slug: core
  title: Configuration and exceptions
  summary: "`PyGeoVisionConfig` and every exception class"
  intro: |
    Settings are read from environment variables and a configuration file; errors derive from one base class so a single
    `except PyGeoVisionError` catches everything the package raises on purpose.
  explained_in:
    - "[Configuration reference](../config.md)"
    - "[Exceptions reference](../exceptions.md)"
  modules: [pygeovision.core.config, pygeovision.core.exceptions]

- slug: pipelines
  title: Pipelines
  summary: "`BasePipeline`, `PipelineResult` and the class behind each of the 41 pipelines"
  intro: |
    A pipeline is a class with a `run(bbox, output_dir, **arguments)` method that returns a `PipelineResult`. The registry
    helpers `get_pipeline`, `list_pipelines`, `pipeline_kinds` and `pipeline_catalogue` look them up by name. Each concrete
    class below is the code behind one catalogue page; the `run` signature lists the arguments and their defaults.
  explained_in:
    - "[Pipelines](../../pipelines/index.md)"
    - "[The catalogue](../../pipelines/catalog/index.md)"
    - "[Reading results](../../pipelines/results.md)"
    - "[Write your own pipeline](../../pipelines/custom.md)"
  modules:
    - pygeovision.ai.pipelines
    - pygeovision.ai.pipelines.domains
    - pygeovision.ai.pipelines.reference_products
    - pygeovision.ai.pipelines.vector_products
    - pygeovision.ai.pipelines.terrain
    - pygeovision.ai.pipelines.timeseries
    - pygeovision.ai.pipelines.sar_flood
    - pygeovision.ai.pipelines.multisensor_flood

