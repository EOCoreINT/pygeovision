<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PyGeoVision — Full Chain Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#090E1E;--panel:#0A1628;--panel2:#0D1C34;
  --green:#00C896;--blue:#0057FF;--amber:#FF8C00;
  --violet:#C084FC;--red:#FF3B5C;--white:#F4F6FB;
  --slate:#8896B3;--dim:#1A2035;
  --f-disp:'Space Grotesk',sans-serif;
  --f-code:'JetBrains Mono',monospace;
  --f-body:'Inter',sans-serif;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--f-body);color:var(--white);user-select:none}

/* ── Progress bar ─────────────────────────────────────────── */
#progress-bar{
  position:fixed;top:0;left:0;height:3px;z-index:999;
  background:linear-gradient(90deg,var(--green),var(--blue),var(--violet));
  transition:width .4s ease;
}
/* ── Controls ─────────────────────────────────────────────── */
#controls{
  position:fixed;bottom:80px;right:32px;z-index:999;
  display:flex;gap:10px;
}
.ctrl-btn{
  width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.15);
  background:rgba(10,22,40,.8);backdrop-filter:blur(12px);
  color:var(--white);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.ctrl-btn:hover{background:rgba(0,87,255,.3);border-color:var(--blue);}

/* ── Slide counter ────────────────────────────────────────── */
#counter{
  position:fixed;top:20px;right:28px;z-index:999;
  font-family:var(--f-code);font-size:12px;color:var(--slate);
}
/* ── Scene label ──────────────────────────────────────────── */
#scene-label{
  position:fixed;top:20px;left:28px;z-index:999;
  font-family:var(--f-code);font-size:11px;color:var(--green);
  letter-spacing:2px;text-transform:uppercase;opacity:.8;
}

/* ── Narration bar ────────────────────────────────────────── */
#narration{
  position:fixed;bottom:0;left:0;right:0;z-index:998;
  background:rgba(9,14,30,.92);backdrop-filter:blur(20px);
  border-top:1px solid rgba(0,200,150,.15);
  padding:14px 48px;min-height:56px;
  display:flex;align-items:center;
  font-size:15px;line-height:1.6;color:#B8C5D8;
}
#narration span.hl{color:var(--white);font-weight:500;}
#narration span.code{font-family:var(--f-code);color:var(--green);font-size:13px;
  background:rgba(0,200,150,.08);padding:1px 6px;border-radius:4px;}

/* ── Slide container ──────────────────────────────────────── */
#stage{width:100vw;height:100vh;position:relative;overflow:hidden}
.slide{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:64px 80px 80px;
  opacity:0;transform:translateY(24px);
  transition:opacity .5s ease,transform .5s ease;
  pointer-events:none;
}
.slide.active{opacity:1;transform:none;pointer-events:auto;}
.slide.exit{opacity:0;transform:translateY(-24px);}

/* ── Background globe/grid ────────────────────────────────── */
.bg-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(0,87,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,87,255,.04) 1px,transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse 80% 70% at 50% 50%,black 30%,transparent 100%);
}
.bg-glow{position:absolute;inset:0;pointer-events:none}
.glow-green{position:absolute;width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,200,150,.12) 0%,transparent 70%);
  top:-100px;right:-100px;}
.glow-blue{position:absolute;width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,87,255,.10) 0%,transparent 70%);
  bottom:-100px;left:-100px;}

/* ── Typography ───────────────────────────────────────────── */
.eyebrow{
  font-family:var(--f-code);font-size:11px;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--green);margin-bottom:16px;display:flex;align-items:center;gap:8px;
}
.eyebrow::before{content:'';width:20px;height:1px;background:var(--green);}
.headline{
  font-family:var(--f-disp);font-size:clamp(42px,5.5vw,72px);
  font-weight:700;letter-spacing:-2px;line-height:1.05;text-align:center;
  margin-bottom:20px;
}
.headline em{font-style:normal;
  background:linear-gradient(135deg,var(--green),var(--blue));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.subline{font-size:18px;color:var(--slate);text-align:center;max-width:600px;line-height:1.7;}

/* ── Terminal ─────────────────────────────────────────────── */
.terminal{
  background:#06090F;border:1px solid rgba(255,255,255,.1);
  border-radius:14px;overflow:hidden;width:100%;max-width:780px;
  box-shadow:0 24px 64px rgba(0,0,0,.5),0 0 0 1px rgba(0,200,150,.08);
}
.term-bar{
  background:#0E1424;padding:12px 16px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.term-dot{width:10px;height:10px;border-radius:50%;}
.term-title{font-family:var(--f-code);font-size:12px;color:var(--slate);margin-left:8px;}
.term-body{padding:20px 24px 24px;font-family:var(--f-code);font-size:13.5px;
  line-height:1.85;min-height:120px;}
.t-prompt{color:var(--green);}
.t-cmd{color:#E2E8F0;}
.t-out{color:var(--slate);}
.t-ok{color:var(--green);}
.t-warn{color:var(--amber);}
.t-val{color:#60A5FA;}
.t-kw{color:#F472B6;}
.t-str{color:var(--green);}
.cursor{display:inline-block;width:8px;height:15px;background:var(--green);
  vertical-align:text-bottom;animation:blink .9s step-end infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ── Architecture diagram ─────────────────────────────────── */
.arch-row{display:flex;gap:16px;align-items:stretch;justify-content:center;flex-wrap:wrap;}
.arch-box{
  background:var(--panel2);border:1px solid rgba(255,255,255,.08);
  border-radius:14px;padding:24px 28px;min-width:200px;flex:1;max-width:260px;
  position:relative;overflow:hidden;transition:transform .2s,border-color .2s;
}
.arch-box:hover{transform:translateY(-4px);}
.arch-box.green{border-color:rgba(0,200,150,.3);}
.arch-box.blue{border-color:rgba(0,87,255,.3);}
.arch-box.amber{border-color:rgba(255,140,0,.3);}
.arch-box.violet{border-color:rgba(192,132,252,.3);}
.arch-box-icon{font-size:28px;margin-bottom:10px;}
.arch-box-title{font-family:var(--f-disp);font-size:16px;font-weight:600;margin-bottom:6px;}
.arch-box-sub{font-size:12px;color:var(--slate);line-height:1.5;}
.arch-arrow{
  display:flex;align-items:center;color:var(--slate);font-size:20px;
  align-self:center;flex-shrink:0;
}

/* ── Stat cards ───────────────────────────────────────────── */
.stats-row{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}
.stat-card{
  background:var(--panel2);border:1px solid rgba(255,255,255,.07);
  border-radius:14px;padding:24px 32px;text-align:center;min-width:140px;
}
.stat-val{
  font-family:var(--f-disp);font-size:42px;font-weight:700;
  letter-spacing:-1px;line-height:1;
}
.stat-label{font-size:13px;color:var(--slate);margin-top:6px;}

/* ── Pipeline flow ────────────────────────────────────────── */
.pipe-flow{display:flex;align-items:center;gap:0;width:100%;max-width:900px;}
.pipe-step{
  flex:1;background:var(--panel2);border:1px solid rgba(255,255,255,.07);
  padding:20px 18px;text-align:center;position:relative;
  transition:background .2s;
}
.pipe-step:first-child{border-radius:12px 0 0 12px;}
.pipe-step:last-child{border-radius:0 12px 12px 0;}
.pipe-step-icon{font-size:24px;margin-bottom:8px;}
.pipe-step-name{font-family:var(--f-disp);font-size:14px;font-weight:600;}
.pipe-step-sub{font-size:11px;color:var(--slate);margin-top:4px;}
.pipe-arrow{color:var(--slate);font-size:18px;padding:0 6px;flex-shrink:0;}

/* ── Provider grid ────────────────────────────────────────── */
.provider-grid{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:720px;
}
.prov-chip{
  font-family:var(--f-code);font-size:11px;padding:5px 12px;
  border-radius:20px;border:1px solid;white-space:nowrap;
  transition:transform .1s;
}
.prov-chip:hover{transform:scale(1.05);}
.prov-open{background:rgba(0,200,150,.08);border-color:rgba(0,200,150,.3);color:var(--green);}
.prov-auth{background:rgba(0,87,255,.08);border-color:rgba(0,87,255,.3);color:#60A5FA;}

/* ── Model zoo wheel ──────────────────────────────────────── */
.zoo-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:720px;width:100%;
}
.zoo-card{
  background:var(--panel2);border:1px solid rgba(255,255,255,.07);
  border-radius:12px;padding:16px;
  transition:border-color .2s,transform .2s;
}
.zoo-card:hover{border-color:rgba(192,132,252,.4);transform:translateY(-2px);}
.zoo-card-task{font-family:var(--f-code);font-size:10px;color:var(--violet);
  letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.zoo-card-title{font-size:14px;font-weight:600;margin-bottom:4px;}
.zoo-card-count{font-size:12px;color:var(--slate);}

/* ── Dataset table ────────────────────────────────────────── */
.ds-list{display:flex;flex-direction:column;gap:8px;width:100%;max-width:800px;}
.ds-row{
  display:flex;align-items:center;gap:16px;
  background:var(--panel2);border:1px solid rgba(255,255,255,.06);
  border-radius:10px;padding:12px 18px;
  transition:border-color .15s;
}
.ds-row:hover{border-color:rgba(0,200,150,.3);}
.ds-name{font-family:var(--f-code);font-size:13px;color:var(--white);flex:1;}
.ds-domain{font-size:11px;color:var(--slate);width:100px;}
.ds-mod{font-size:11px;width:90px;}
.ds-vol{font-family:var(--f-code);font-size:12px;color:var(--amber);width:60px;text-align:right;}

/* ── Result panel ─────────────────────────────────────────── */
.result-panel{
  background:var(--panel2);border:1px solid rgba(0,200,150,.2);
  border-radius:16px;padding:28px 32px;width:100%;max-width:780px;
}
.result-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);
}
.result-row:last-child{border-bottom:none;}
.result-key{font-size:14px;color:var(--slate);}
.result-val{font-family:var(--f-code);font-size:14px;color:var(--green);}

/* ── Before/After ─────────────────────────────────────────── */
.ba-pair{display:flex;gap:20px;width:100%;max-width:800px;}
.ba-card{
  flex:1;background:var(--panel2);border:1px solid rgba(255,255,255,.07);
  border-radius:14px;overflow:hidden;
}
.ba-img{width:100%;height:180px;display:flex;align-items:center;justify-content:center;
  font-size:64px;}
.ba-label{
  padding:12px 16px;font-family:var(--f-code);font-size:12px;
  display:flex;justify-content:space-between;
}

/* ── SVG Globe ────────────────────────────────────────────── */
#globe-wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  opacity:.18;z-index:0;pointer-events:none;}

/* ── Animations ───────────────────────────────────────────── */
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes orbit{
  0%  {transform:rotate(0deg) translateX(160px) rotate(0deg)}
  100%{transform:rotate(360deg) translateX(160px) rotate(-360deg)}
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes barFill{from{width:0}to{width:var(--w,100%)}}
@keyframes countUp{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.anim-fadeup{animation:fadeUp .5s ease both;}
.anim-fadeup-1{animation:fadeUp .5s .1s ease both;}
.anim-fadeup-2{animation:fadeUp .5s .2s ease both;}
.anim-fadeup-3{animation:fadeUp .5s .3s ease both;}
.anim-fadeup-4{animation:fadeUp .5s .4s ease both;}
.count-anim{animation:countUp .5s ease both;}

/* ── Highlight row ────────────────────────────────────────── */
.hl-row{
  background:rgba(0,200,150,.07);border:1px solid rgba(0,200,150,.2);
  border-radius:8px;padding:16px 20px;
  font-family:var(--f-code);font-size:14px;
  display:flex;gap:12px;align-items:center;
}
</style>
</head>
<body>

<!-- Progress bar -->
<div id="progress-bar" style="width:0%"></div>

<!-- Scene label -->
<div id="scene-label">Scene <span id="scene-num">01</span></div>

<!-- Slide counter -->
<div id="counter"><span id="cur">1</span> / <span id="tot">17</span></div>

<!-- Controls -->
<div id="controls">
  <button class="ctrl-btn" id="btn-prev" title="Previous">‹</button>
  <button class="ctrl-btn" id="btn-play" title="Pause">⏸</button>
  <button class="ctrl-btn" id="btn-next" title="Next">›</button>
</div>

<!-- Narration bar -->
<div id="narration"></div>

<!-- Stage -->
<div id="stage"></div>

<script>
// ─────────────────────────────────────────────────────────────
// SLIDES DATA
// ─────────────────────────────────────────────────────────────
const SLIDES = [
  // 0 — HERO
  { dur: 6000, label: "Introduction", narration: `<span class="hl">PyGeoVision</span> is the world-class geospatial AI platform — unifying <span class="code">PyGeoFetch</span> (22+ satellite providers), <span class="code">GeoAI</span> (complete AI stack), and the <span class="code">EarthNets</span> framework into a single, production-ready Python package.`,
    html: `
    <div class="bg-grid"></div>
    <div class="bg-glow"><div class="glow-green"></div><div class="glow-blue"></div></div>
    <svg id="globe-wrap" width="420" height="420" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="gg" cx="50%" cy="50%">
          <stop offset="0%" stop-color="#00C896" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#0057FF" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="210" cy="210" r="160" fill="none" stroke="#00C896" stroke-width="1" stroke-dasharray="4 8"/>
      <circle cx="210" cy="210" r="120" fill="none" stroke="#0057FF" stroke-width="1" stroke-dasharray="3 12"/>
      <circle cx="210" cy="210" r="80"  fill="none" stroke="#C084FC" stroke-width="1" stroke-dasharray="2 16"/>
      <circle cx="210" cy="210" r="160" fill="url(#gg)" opacity="0.6"/>
      <g style="transform-origin:210px 210px;animation:spin 20s linear infinite">
        <circle cx="370" cy="210" r="6" fill="#00C896"/>
      </g>
      <g style="transform-origin:210px 210px;animation:spin 14s linear infinite reverse">
        <circle cx="90" cy="210" r="5" fill="#0057FF"/>
      </g>
      <g style="transform-origin:210px 210px;animation:spin 8s linear infinite">
        <circle cx="210" cy="50" r="4" fill="#C084FC"/>
      </g>
    </svg>
    <div style="position:relative;z-index:2;text-align:center;animation:fadeUp .8s ease">
      <div class="eyebrow">🛰️ &nbsp;Geospatial AI Platform — v2.0</div>
      <h1 class="headline" style="font-size:clamp(52px,7vw,88px)">
        <em>PyGeoVision</em>
      </h1>
      <p style="font-size:22px;color:var(--slate);max-width:580px;line-height:1.6;margin:0 auto 40px">
        Satellite data meets geospatial intelligence.<br/>
        The complete Earth observation platform.
      </p>
      <div class="stats-row" style="margin-top:0">
        <div class="stat-card"><div class="stat-val" style="color:var(--blue)">22+</div><div class="stat-label">Providers</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--green)">220+</div><div class="stat-label">Datasets</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--violet)">98</div><div class="stat-label">AI Models</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--amber)">26</div><div class="stat-label">Pipelines</div></div>
      </div>
    </div>`
  },

  // 1 — THE PROBLEM
  { dur: 5500, label: "The Challenge", narration: `Earth observation was fragmented — researchers had to stitch together <span class="hl">dozens of tools</span>, APIs, and providers. No single platform covered search, download, AI inference, training, and deployment in one coherent workflow.`,
    html: `
    <div class="bg-grid"></div>
    <div class="eyebrow anim-fadeup">The challenge</div>
    <h2 class="headline anim-fadeup-1">Fragmented.<br/>Complex. <em>Slow.</em></h2>
    <div class="arch-row anim-fadeup-2" style="margin-top:32px">
      ${[["🗺️","Provider APIs","22+ separate auth systems"],["🤖","AI Models","No unified inference"],["📊","Datasets","No standard catalog"],["🔄","Pipelines","Manual, error-prone"]].map(([i,t,s])=>`
      <div class="arch-box" style="border-color:rgba(255,59,92,.3)">
        <div class="arch-box-icon">${i}</div>
        <div class="arch-box-title">${t}</div>
        <div class="arch-box-sub">${s}</div>
      </div>`).join('')}
    </div>`
  },

  // 2 — ARCHITECTURE
  { dur: 6000, label: "Architecture", narration: `PyGeoVision solves this with three unified layers: <span class="code">PyGeoFetch</span> for satellite data, <span class="code">GeoAI</span> for AI inference, and <span class="code">EarthNets</span> for datasets and models — all behind one clean Python API.`,
    html: `
    <div class="bg-grid"></div>
    <div class="eyebrow anim-fadeup">Architecture</div>
    <h2 class="headline anim-fadeup-1">One API. <em>Three layers.</em></h2>
    <div style="width:100%;max-width:900px;margin-top:28px" class="anim-fadeup-2">
      <div class="arch-row">
        <div class="arch-box green" style="flex:2;max-width:none;background:rgba(0,200,150,.04)">
          <div class="arch-box-icon">🛰️</div>
          <div class="arch-box-title" style="color:var(--green)">PyGeoFetch — Data Layer</div>
          <div class="arch-box-sub">22+ satellite providers · Parallel download · Post-processing chains · YAML pipelines · Credential management</div>
        </div>
      </div>
      <div style="text-align:center;padding:10px 0;color:var(--slate);font-size:24px">↕</div>
      <div class="arch-row">
        <div class="arch-box violet" style="flex:2;max-width:none;background:rgba(192,132,252,.04)">
          <div class="arch-box-icon">🤖</div>
          <div class="arch-box-title" style="color:var(--violet)">GeoAI — AI Layer</div>
          <div class="arch-box-sub">24 subsystems · Segmentation · Detection · Change · SAM · Prithvi · DINOv2 · Moondream · Training</div>
        </div>
      </div>
      <div style="text-align:center;padding:10px 0;color:var(--slate);font-size:24px">↕</div>
      <div class="arch-row">
        <div class="arch-box amber" style="flex:2;max-width:none;background:rgba(255,140,0,.04)">
          <div class="arch-box-icon">📊</div>
          <div class="arch-box-title" style="color:var(--amber)">EarthNets — Knowledge Layer</div>
          <div class="arch-box-sub">220+ datasets · 98 model architectures · 26 production pipelines · Benchmark builder</div>
        </div>
      </div>
    </div>`
  },

  // 3 — STEP 1: INIT
  { dur: 5000, label: "Step 1 · Initialise", narration: `The chain begins with a single import. <span class="code">PyGeoVision()</span> instantly shows which components are available — <span class="hl">pygeofetch</span> for data, <span class="hl">geoai</span> for AI, and the full EarthNets catalog.`,
    html: `
    <div class="bg-grid"></div>
    <div class="eyebrow anim-fadeup">Step 1 — Initialise</div>
    <h2 class="headline anim-fadeup-1">One line to <em>start everything.</em></h2>
    <div class="terminal anim-fadeup-2" style="margin-top:24px">
      <div class="term-bar">
        <div class="term-dot" style="background:#FF5F57"></div>
        <div class="term-dot" style="background:#FFBD2E"></div>
        <div class="term-dot" style="background:#28CA41"></div>
        <span class="term-title">pygeovision_demo.py</span>
      </div>
      <div class="term-body">
        <div><span class="t-kw">import</span> <span class="t-cmd">pygeovision</span> <span class="t-kw">as</span> <span class="t-cmd">pgv</span></div>
        <div style="margin-top:10px"><span class="t-cmd">client</span> <span style="color:#64748B">=</span> <span class="t-val">pgv</span>.<span class="t-cmd">PyGeoVision</span>()</div>
        <div><span class="t-cmd">print</span>(<span class="t-cmd">client</span>)</div>
        <div style="margin-top:10px;color:#4B5563">▶ OUTPUT</div>
        <div class="t-ok">PyGeoVision(v2.1.5 | pygeofetch=✓ | geoai=✓ | datasets=220 | models=98 | pipelines=26)</div>
        <div style="margin-top:10px"><span class="t-cmd">client</span>.<span class="t-cmd">status</span>()
        </div>
        <div class="t-out">{'pygeofetch': {'available': True, 'version': '1.0.0', 'providers': 22},</div>

// ─────────────────────────────────────────────────────────────
// ENGINE
// ─────────────────────────────────────────────────────────────
let cur = 0, timer = null, playing = true;
const stage = document.getElementById("stage");
const narr  = document.getElementById("narration");
const bar   = document.getElementById("progress-bar");
const sceneNum = document.getElementById("scene-num");
const ctr   = document.getElementById("cur");
const tot   = document.getElementById("tot");
const btnPlay = document.getElementById("btn-play");

tot.textContent = SLIDES.length;

// Build all slides into DOM
SLIDES.forEach((s, i) => {
  const el = document.createElement("div");
  el.className = "slide";
  el.id = `slide-${i}`;
  el.innerHTML = s.html;
  stage.appendChild(el);
});

function goTo(idx, force = false) {
  if (idx < 0 || idx >= SLIDES.length) return;
  const prev = document.getElementById(`slide-${cur}`);
  if (prev) { prev.classList.remove("active"); prev.classList.add("exit"); setTimeout(() => prev.classList.remove("exit"), 500); }
  cur = idx;
  const el = document.getElementById(`slide-${cur}`);
  el.classList.add("active");
  narr.innerHTML = SLIDES[cur].narration;
  bar.style.width = `${((cur + 1) / SLIDES.length) * 100}%`;
  ctr.textContent = cur + 1;
  sceneNum.textContent = String(cur + 1).padStart(2, "0");
  document.getElementById("scene-label").querySelector("span").textContent = String(cur + 1).padStart(2, "0");
  document.getElementById("scene-label").innerHTML = `${SLIDES[cur].label || "Scene"} <span id="scene-num">${String(cur+1).padStart(2,"0")}</span>`;
  clearTimeout(timer);
  if (playing) timer = setTimeout(() => goTo((cur + 1) % SLIDES.length), SLIDES[cur].dur);
}

function togglePlay() {
  playing = !playing;
  btnPlay.textContent = playing ? "⏸" : "▶";
  if (playing) timer = setTimeout(() => goTo((cur + 1) % SLIDES.length), SLIDES[cur].dur);
  else clearTimeout(timer);
}

document.getElementById("btn-play").addEventListener("click", togglePlay);
document.getElementById("btn-next").addEventListener("click", () => { clearTimeout(timer); goTo((cur + 1) % SLIDES.length); });
document.getElementById("btn-prev").addEventListener("click", () => { clearTimeout(timer); goTo((cur - 1 + SLIDES.length) % SLIDES.length); });
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); clearTimeout(timer); goTo((cur + 1) % SLIDES.length); }
  if (e.key === "ArrowLeft") { e.preventDefault(); clearTimeout(timer); goTo((cur - 1 + SLIDES.length) % SLIDES.length); }
  if (e.key === "p" || e.key === "P") togglePlay();
});

// Start
goTo(0);
</script>
