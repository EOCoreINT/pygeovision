[mypy]
python_version        = 3.10
ignore_missing_imports = True
warn_return_any       = False
warn_unused_configs   = True
check_untyped_defs    = True
no_implicit_optional  = True
strict_optional       = True
pretty                = True

# Exclude heavy optional deps that are always ignore_missing
[mypy-pygeofetch.*]
ignore_missing_imports = True

[mypy-geoai.*]
ignore_missing_imports = True

[mypy-rasterio.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-torchvision.*]
ignore_missing_imports = True

[mypy-transformers.*]
ignore_missing_imports = True

[mypy-geopandas.*]
ignore_missing_imports = True

[mypy-shapely.*]
ignore_missing_imports = True

[mypy-faiss.*]
ignore_missing_imports = True

[mypy-optuna.*]
ignore_missing_imports = True

[mypy-mlflow.*]
ignore_missing_imports = True

[mypy-wandb.*]
ignore_missing_imports = True

[mypy-albumentations.*]
ignore_missing_imports = True

[mypy-timm.*]
ignore_missing_imports = True

[mypy-segmentation_models_pytorch.*]
ignore_missing_imports = True
