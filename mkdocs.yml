site_name: PyGeoVision
site_description: "AI-powered geospatial intelligence platform — satellite data + AI in one API"
site_url: https://appiahkubis14.github.io/pygeovision-docs/
site_author: PyGeoVision Contributors
repo_url: https://github.com/appiahkubis14/PyGeoVision
repo_name: appiahkubis14/PyGeoVision
copyright: "Copyright © 2026 PyGeoVision Contributors. Apache 2.0 License."

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle: { icon: material/brightness-4, name: Switch to light mode }
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.integrate
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo.svg
  favicon: assets/favicon.ico

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true

markdown_extensions:
  - pymdownx.highlight:   { anchor_linenums: true }
  - pymdownx.superfences: { custom_fences: [{name: mermaid, class: mermaid, format: !!python/name:pymdownx.superfences.fence_code_format}]}
  - pymdownx.tabbed:      { alternate_style: true }
  - pymdownx.details
  - admonition
  - toc: { permalink: true }
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quick Start: quickstart.md
    - Architecture: architecture.md
    - FAQ: faq.md
  - Tutorials:
    - Overview: tutorials/index.md
    - 1. Data Acquisition: tutorials/02_data_acquisition.md
    - 2. Preprocessing: tutorials/03_preprocessing.md
    - 3. Spectral Indices: tutorials/04_spectral_indices.md
    - 4. AI Models: tutorials/05_ai_models.md
    - 5. Change Detection: tutorials/06_change_detection.md
    - 6. Building Extraction: tutorials/07_building_extraction.md
    - 7. Land Cover: tutorials/08_land_cover.md
    - 8. SAR Processing: tutorials/14_sar_processing.md
    - 9. GeoAgent: tutorials/15_agent.md
    - 10. InSAR: tutorials/insar.md
    - 11. Visualization: tutorials/visualization.md
  - API Reference:
    - Overview: api/index.md
    - PyGeoVision Client: api/pygeovision.md
    - Data Layer: api/data.md
    - Spectral Indices: api/indices.md
    - Postprocessing: api/postprocess.md
    - AI Models: api/ai.md
    - GeoAgent: api/agent.md
    - InSAR: api/insar.md
    - Visualization: api/viz.md
    - CLI Reference: api/cli.md
  - Examples:
    - Overview: examples/index.md
    - Agriculture: examples/agriculture.md
    - Forestry: examples/forestry.md
    - Urban: examples/urban.md
    - Water: examples/water.md
    - Disaster: examples/disaster.md
    - Climate: examples/climate.md
  - Guides:
    - Production Deployment: guides/production.md
    - Scaling: guides/scaling.md
    - Security: guides/security.md
    - Troubleshooting: guides/troubleshooting.md
  - Community:
    - Contributing: contributing.md
    - Changelog: changelog.md
    - Code of Conduct: code_of_conduct.md
