[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "pygeovision"
dynamic     = ["version"]
description = "The World-Class Geospatial AI Platform — standalone 119-model registry, DINOv3, Prithvi-EO-2.0, FastAPI serving, edge/cloud deploy, 51 pipelines, 25 notebooks"
readme      = "README.md"
license     = {text = "Apache-2.0"}
authors     = [{name = "PyGeoVision Contributors"}]
keywords    = [
    "satellite", "geospatial", "remote-sensing", "geoai", "pygeofetch",
    "earthnets", "deep-learning", "foundation-models", "sentinel", "landsat",
    "segmentation", "change-detection", "vegetation-index", "SAR",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.10"
dependencies    = [
    # pygeofetch — satellite data layer (search, download, auth)
    "pygeofetch>=1.1.0",
    # STAC fallback when pygeofetch unavailable
    "pystac>=1.9",
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    # Core utilities
    "pydantic>=2.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "numpy>=1.24",
    "rich>=13.0",
    "shapely>=2.0",
    "pyproj>=3.6",
]

[project.optional-dependencies]
# ── Geospatial raster / vector stack ────────────────────────────────────────
geo = [
    "rasterio>=1.3",
    "geopandas>=1.0",
    "rioxarray>=0.15",
    "pyogrio>=0.7",
    "shapely>=2.0",
    "pyproj>=3.6",
]

# ── Visualisation ────────────────────────────────────────────────────────────
viz = [
    "matplotlib>=3.8",
    "folium>=0.16",
    "plotly>=5.18",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
]

# ── Training (PyTorch + losses + HPO) ───────────────────────────────────────
train = [
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=0.9",
    "segmentation-models-pytorch>=0.3",
    "albumentations>=1.4",
    "optuna>=3.5",
    "mlflow>=2.10",
    "wandb>=0.16",
]

# ── Model serving + ONNX runtime ────────────────────────────────────────────
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "onnxruntime>=1.17",
    "onnxsim>=0.4",
    "websockets>=12.0",
]

# ── Auto-labeling sources ────────────────────────────────────────────────────
labeling = [
    "requests>=2.31",
    "laspy>=2.0",
    "s2sphere>=0.2.5",
    "scipy>=1.12",
    "Pillow>=10.0",
    "faiss-cpu>=1.7",
]

# ── Vision-Language Models (CLIP, Moondream) ─────────────────────────────────
vlm = [
    "transformers>=4.40",
    "torch>=2.0",
    "Pillow>=10.0",
    "open-clip-torch>=2.24",
    "faiss-cpu>=1.7",
]

# ── Explainability / XAI ────────────────────────────────────────────────────
xai = [
    "shap>=0.45",
    "captum>=0.7",
    "torch>=2.0",
    "matplotlib>=3.8",
]

# ── Foundation models (DINOv3, Prithvi-EO-2.0) ──────────────────────────────
foundation = [
    "transformers>=4.40",
    "torch>=2.0",
    "timm>=0.9",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
    "faiss-cpu>=1.7",
]

# ── Advanced AI (Few-shot, AutoML, timeseries) ───────────────────────────────
advanced = [
    "transformers>=4.40",
    "torch>=2.0",
    "optuna>=3.5",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
]

# ── Cloud deployment ─────────────────────────────────────────────────────────
cloud = [
    "boto3>=1.34",
    "sagemaker>=2.0",
    "azure-ai-ml>=1.14",
    "azure-identity>=1.16",
    "google-cloud-aiplatform>=1.47",
    "google-cloud-storage>=2.14",
]

# ── Edge deployment ──────────────────────────────────────────────────────────
edge = [
    "onnxruntime>=1.17",
    "onnxsim>=0.4",
]

# ── 3D / Point cloud ─────────────────────────────────────────────────────────
geo3d = [
    "laspy>=2.0",
    "scipy>=1.12",
    "pandas>=2.0",
    "open3d>=0.18",
]

# ── Drift monitoring ─────────────────────────────────────────────────────────
monitoring = [
    "scipy>=1.12",
    "matplotlib>=3.8",
    "requests>=2.31",
]

# ── InSAR processing chain ──────────────────────────────────────────────────
insar = [
    "scipy>=1.12",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    # For true SLC InSAR: install snaphu and isce2 separately (not on PyPI)
    # pip install git+https://github.com/isce-framework/isce2
    # conda install -c conda-forge snaphu
]

# ── Enterprise (auth, audit, compliance) ─────────────────────────────────────
enterprise = [
    "cryptography>=42.0",
    "passlib[bcrypt]>=1.7",
    "python-jose[cryptography]>=3.3",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
]

# ── GeoAI plugin (optional — not required by core) ───────────────────────────
# PyGeoVision v2.0 is standalone. Install this only if you specifically need
# Tessera embeddings, GroundedSAM, Leafmap, or legacy GeoAI-trained weights.
geoai = ["geoai-py>=0.39.0"]

# ── Development ──────────────────────────────────────────────────────────────
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "black>=24",
    "pre-commit>=3.6",
    "types-pyyaml",
    "types-requests",
]

# ── All (excluding cloud/edge/geoai — install those explicitly) ──────────────
all = [
    "pygeovision[geo,viz,train,serve,labeling,vlm,xai,foundation,advanced,monitoring,geo3d,insar,enterprise]",
]

# ── Minimal install ───────────────────────────────────────────────────────────
minimal = ["pygeovision[geo,train]"]

[project.scripts]
pygeovision = "pygeovision.cli.main:main"

[project.urls]
Homepage      = "https://pygeovision.org"
Documentation = "https://docs.pygeovision.org"
Repository    = "https://github.com/pygeovision/pygeovision"
Issues        = "https://github.com/pygeovision/pygeovision/issues"
Changelog     = "https://github.com/pygeovision/pygeovision/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where   = ["."]
include = ["pygeovision*"]

[tool.setuptools.dynamic]
version = {attr = "pygeovision._version.__version__"}

[tool.pytest.ini_options]
pythonpath   = ["."]
testpaths    = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts      = "-q --tb=short --ignore=tests/test_live.py"
markers      = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "gpu: marks tests requiring GPU",
    "integration: marks tests requiring network",
    "live: marks tests requiring live pygeofetch credentials",
]

[tool.coverage.run]
source   = ["pygeovision"]
omit     = ["*/tests/*", "*/__pycache__/*", "*/cli/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length    = 100
target-version = "py310"
indent-width   = 4

[tool.ruff.lint]
select  = ["E", "F", "W", "I", "B", "C4", "UP", "N", "SIM"]
ignore  = ["E501", "B008", "B905", "N806", "N812", "SIM108"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/*"          = ["S101", "D"]
"pygeovision/cli/*" = ["B006"]

[tool.mypy]
python_version        = "3.10"
ignore_missing_imports = true
warn_return_any       = false
warn_unused_configs   = true
check_untyped_defs    = true
no_implicit_optional  = true
strict_optional       = true

[[tool.mypy.overrides]]
module = ["pygeofetch.*", "geoai.*", "rasterio.*", "torch.*",
          "transformers.*", "geopandas.*", "shapely.*"]
ignore_missing_imports = true