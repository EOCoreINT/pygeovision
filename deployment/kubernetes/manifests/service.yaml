apiVersion: v1
kind: Service
metadata:
  name: pygeovision-api
  namespace: pygeovision
spec:
  selector: {app: pygeovision-api}
  ports:
    - {protocol: TCP, port: 80, targetPort: 8080}
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pygeovision-ingress
  namespace: pygeovision
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts: [api.pygeovision.org]
      secretName: pygeovision-tls
  rules:
    - host: api.pygeovision.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pygeovision-api
                port: {number: 80}
