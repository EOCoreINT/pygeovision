apiVersion: apps/v1
kind: Deployment
metadata:
  name: pygeovision-api
  namespace: pygeovision
spec:
  replicas: 3
  selector:
    matchLabels: {app: pygeovision-api}
  template:
    metadata:
      labels: {app: pygeovision-api}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000}
      containers:
        - name: api
          image: ghcr.io/appiahkubis14/pygeovision:2.1.7
          ports: [{containerPort: 8080}]
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pygeovision-secrets
                  key: anthropic-api-key
                  optional: true
            - name: PGV_LOG_LEVEL
              value: "INFO"
          resources:
            requests: {cpu: "500m", memory: "1Gi"}
            limits: {cpu: "4000m", memory: "8Gi"}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: pgv-data
              mountPath: /data
      volumes:
        - name: pgv-data
          persistentVolumeClaim:
            claimName: pygeovision-pvc
